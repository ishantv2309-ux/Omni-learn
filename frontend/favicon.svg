<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Midnight Obsidian to Ocean Prussian -->
    <linearGradient id="omniBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26425A" />
      <stop offset="60%" stop-color="#162B40" />
      <stop offset="100%" stop-color="#0E1F2F" />
    </linearGradient>

    <!-- Periwinkle Glow Gradient -->
    <linearGradient id="periGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86A8CF" />
      <stop offset="100%" stop-color="#7097C2" />
    </linearGradient>

    <!-- Mauve Accent Gradient -->
    <linearGradient id="mauveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C38EB4" />
      <stop offset="100%" stop-color="#E1CBD7" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#omniBg)" stroke="#86A8CF" stroke-width="1.5" />

  <!-- Outer Orbital Ring in Periwinkle -->
  <ellipse cx="32" cy="32" rx="23" ry="8.5" fill="none" stroke="url(#periGrad)" stroke-width="2" stroke-dasharray="3 2" transform="rotate(-25 32 32)" filter="url(#glow)" opacity="0.95" />

  <!-- Modern Geometric Knowledge Prism -->
  <!-- Top Facet -->
  <polygon points="32,13 52,24 32,35 12,24" fill="#FFFFFF" filter="url(#glow)" />
  
  <!-- Left Shade Facet in Lavender Blush -->
  <polygon points="12,24 32,35 32,49 12,38" fill="#E1CBD7" opacity="0.9" />
  
  <!-- Right Shade Facet in Vintage Mauve -->
  <polygon points="52,24 32,35 32,49 52,38" fill="#C38EB4" opacity="0.95" />

  <!-- Center Energy Core Beacon -->
  <circle cx="32" cy="24" r="3.5" fill="url(#mauveGrad)" filter="url(#glow)" />
  
  <!-- Mauve Tassel Stream -->
  <path d="M 52,24 Q 55,34 47,43" fill="none" stroke="url(#mauveGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="47" cy="43" r="2.5" fill="#C38EB4" />
</svg>
